[tox]
envlist = flake8, pylint, mypy, vulture, pytest, eslint, htmlhint, shellcheck
skipsdist = true

[testenv]
# Follow the container's interpreter rather than pinning a minor version.
#
# This said python3.12, and Arch no longer ships it. tox does not fail when it
# cannot find the pinned interpreter -- it SKIPS every environment and reports
# each one as a skip, so the run reads as "nothing to do" rather than "nothing
# ran". All eight skipped: flake8, pylint, mypy, vulture, pytest, eslint,
# htmlhint, shellcheck. Only tox's final `evaluation failed` and exit 255 made
# it a failure at all.
#
# The 3.12 label has now misled this project three times. It was read off this
# line and reported as the interpreter while everything actually ran on 3.11
# for weeks; results were later measured identical on 3.11.15 and 3.12.3; and
# now it turns out that in a container built today the version named here does
# not exist, so the suite cannot run at all.
#
# A pin here buys nothing -- the container decides which python is installed,
# and the two versions ever measured agreed. Naming it twice only creates a
# way for them to disagree silently.
basepython = python3
sitepackages = true
changedir = /src

[testenv:flake8]
allowlist_externals = bash
commands = bash -c 'flake8 --config=testenv/linters/flake8.ini kvmd testenv/tests *.py'
deps =
	flake8
	flake8-quotes
	-rrequirements.txt

[testenv:pylint]
allowlist_externals = bash
commands = bash -c 'pylint -j0 --rcfile=testenv/linters/pylint.ini --output-format=colorized --reports=no kvmd testenv/tests *.py'
deps =
	pylint
	pytest
	pytest-asyncio
	aiohttp-basicauth
	-rrequirements.txt

[testenv:mypy]
allowlist_externals = bash
commands = bash -c 'mypy --config-file=testenv/linters/mypy.ini --cache-dir=testenv/.mypy_cache kvmd testenv/tests *.py'
deps =
	mypy
	-rrequirements.txt

[testenv:vulture]
allowlist_externals = bash
commands = bash -c 'vulture --ignore-names=_format_P,Plugin --ignore-decorators=@exposed_http,@exposed_ws,@pytest.fixture kvmd testenv/tests *.py testenv/linters/vulture-wl.py'
deps =
	vulture
	-rrequirements.txt

[testenv:pytest]
# `kvmd` is in the testpath alongside testenv/tests because flake8, pylint,
# mypy and vulture above all pass `kvmd` and pytest did not. That asymmetry
# made an orphan suite look maintained: kvmd/apps/kvmd/api/mcp_test.py on the
# mcp branch is 55 tests covering route auth, the body-size cap, batch
# rejection and four redaction properties, and four of the five envs touched
# it while the only one that could run it did not. Collects nothing extra on
# branches without such a file.
commands = py.test -vv --cov-config=testenv/linters/coverage.ini --cov-report=term-missing --cov=kvmd testenv/tests kvmd
setenv =
	PYTHONPATH=/src
deps =
	pytest
	pytest-cov
	pytest-mock
	pytest-asyncio
	pytest-aiohttp
	aiohttp-basicauth
	-rrequirements.txt

[testenv:eslint]
allowlist_externals = eslint
commands = eslint --cache-location=/tmp --config=testenv/linters/eslintrc.js --color web/share/js

[testenv:htmlhint]
allowlist_externals = htmlhint
commands = htmlhint --config=testenv/linters/htmlhint.json web/*.html web/*/*.html

[testenv:shellcheck]
allowlist_externals = bash
commands = bash -c 'shellcheck --color=always kvmd.install scripts/*'
